name: CI

on:
  push:
    branches: [aws_migrations]
  pull_request:

jobs:
  python:
    name: Python - lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -v
      - run: uv build --wheel

  dbt:
    name: dbt - parse project
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt
    env:
      # parsing needs a profile but never connects
      DATABRICKS_HOST: ci.cloud.databricks.com
      DATABRICKS_HTTP_PATH: /sql/1.0/warehouses/ci
      DATABRICKS_TOKEN: ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run dbt deps --profiles-dir profiles
      - run: uv run dbt parse --profiles-dir profiles
